
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doggy Doggy | Admin Login</title>


  <style>
.login-logo {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin: 0 0 20px;
}

.login-logo img {
  display: block;
  width: 180px;
  height: auto;
  max-width: 100%;
  object-fit: contain;
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f7f4ef;
      font-family: Arial, sans-serif;
      color: #292929;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 35px #00000012;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #292929;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
    }

    a {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>
  <main class="login-card">
<div class="login-logo">
  <img src="./images/doggy-logo2.png" alt="Doggy Doggy Logo">
</div>
    <p class="subtitle">Administrator Login</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="login-button" type="submit">Log In</button>
      <p id="message" role="status"></p>
    </form>

    <a href="index.html">Back to website</a>
  </main>

  <script src="login.js"></script>
</body>
</html>
