
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doggy Doggy | Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #fff8f0;
      font-family: Arial, sans-serif;
      color: #292929;
    }

    .account-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #00000012;
    }

    .account-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .account-logo img {
      display: block;
      width: 180px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #0f4c97;
      border-color: #0f4c97;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #0f4c97;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 22px;
      text-align: center;
    }

    .links a {
      color: #8a4b23;
    }
  </style>
</head>

<body>
  <main class="account-card">
    <a href="index.html" class="account-logo">
      <img src="images/doggy-logo2.png" alt="Doggy Doggy Logo">
    </a>

    <h1>Reset your password</h1>

    <p class="subtitle">
      Enter a new password for your Doggy Doggy account.
    </p>

    <form id="reset-form">
      <label for="new-password">New password</label>
      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirm-password">Confirm new password</label>
      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button id="reset-button" type="submit">
        Save New Password
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      <a href="account.html">Back to Log In</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reset-password.js"></script>
</body>
</html>
